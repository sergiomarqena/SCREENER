[project]
name = "nordvex-api"
version = "0.1.0"
description = "NORDVEX market data and analytics API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "httpx>=0.27.2",
  "pydantic-settings>=2.6.1",
  "asyncpg>=0.30.0",
]
[project.optional-dependencies]
dev = ["pytest>=8.3.4", "pytest-asyncio>=0.24.0", "ruff>=0.8.2"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
