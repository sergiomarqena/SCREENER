services:
  api:
    build: ./apps/api
    env_file: ./apps/api/.env
    ports: ["8000:8000"]
    depends_on: [redis, postgres]
  web:
    build: .
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [api]
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nordvex
      POSTGRES_USER: nordvex
      POSTGRES_PASSWORD: nordvex
    volumes: [nordvex_pg:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    command: ["redis-server","--appendonly","yes"]
volumes:
  nordvex_pg:
